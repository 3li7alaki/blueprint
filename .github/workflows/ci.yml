name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

  dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no em dashes or en dashes
        # Test files are exempt: they must contain the literal runes to prove the gate
        # detects them. Everything else, prose and code alike, must be clean.
        run: |
          if grep -rIn --exclude-dir=.git --exclude='*_test.go' -P '\x{2014}|\x{2013}' . ; then
            echo "found an em dash or en dash. Use a comma, a colon, parentheses, or a full stop."
            exit 1
          fi
